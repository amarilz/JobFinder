openapi: 3.0.4
info:
  title: JobFinder
  description: JobFinder
  version: 1.0.0

servers:
  - url: https://localhost:8080

tags:
  - name: job
    description: Everything about your Jobs postings
  - name: config
    description: Everything about your application config

paths:

  /job:
    parameters:
      - $ref: '#/components/parameters/correlationIdRequestHeader'
    post:
      tags:
        - job
      summary: New job posting to the database
      description: New job posting
      operationId: newJobPosting
      requestBody:
        $ref: '#/components/requestBodies/newJobPostingRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/newJobPostingResponseBody'
        '400':
          $ref: '#/components/responses/badRequest'
        '500':
          $ref: '#/components/responses/internalServerError'
  /config:
    parameters:
      - $ref: '#/components/parameters/correlationIdRequestHeader'
    get:
      tags:
        - config
      summary: Get chrome extension config
      description: Get extension config
      operationId: getChromeExtensionConfig
      responses:
        '200':
          $ref: '#/components/responses/chromeExtensionConfigResponseBody'
        '500':
          $ref: '#/components/responses/internalServerError'
  /job/application:
    parameters:
      - $ref: '#/components/parameters/correlationIdRequestHeader'
    patch:
      tags:
        - job
      summary: Update application status for a job posting
      operationId: updateJobApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobApplicationDto'
      responses:
        '200':
          description: Application status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobApplicationDtoResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '500':
          $ref: '#/components/responses/internalServerError'

components:

  requestBodies:
    newJobPostingRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/jobPostingDto'

  responses:
    newJobPostingResponseBody:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/jobPostingDtoResponse'
    chromeExtensionConfigResponseBody:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/chromeExtensionConfigDtoResponse'
    # 200
    ok:
      description: Ok
      content: { }
    # 400
    badRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponseMessage'
    # 500
    internalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponseMessage'


  schemas:
    jobPostingDto:
      type: object
      required:
        - originWebsite
        - company
        - title
        - candidates
        - body
        - postedDate
      properties:
        originWebsite:
          type: string
          minLength: 1
          maxLength: 2048
          example: "https://www.linkedin.com/jobs/view/4449236124/"
        company:
          type: string
          minLength: 1
          maxLength: 100
          example: "Tech Corp"
        location:
          type: string
          example: "Milano, Italia"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Software Engineer"
        candidates:
          type: string
          minLength: 1
          example: "7 applicants"
        body:
          type: string
          minLength: 1
          maxLength: 10000
        postedDate:
          type: string
          example: "1 settimana fa"

    jobPostingDtoResponse:
      type: object
      required:
        - esito
        - message
        - applied
      properties:
        esito:
          $ref: '#/components/schemas/esito'
        message:
          type: string
          example: "Non sei interessato al C++"
        applied:
          type: boolean

    jobApplicationDto:
      type: object
      required:
        - originWebsite
        - applied
      properties:
        originWebsite:
          type: string
          minLength: 1
          maxLength: 2048
          example: "https://www.linkedin.com/jobs/view/4449236124/"
        applied:
          type: boolean

    jobApplicationDtoResponse:
      type: object
      required:
        - applied
      properties:
        applied:
          type: boolean

    chromeExtensionConfigDtoResponse:
      type: object
      required:
        - htmlSelector
        - positiveKeyword
        - negativeKeyword
      properties:
        htmlSelector:
          $ref: '#/components/schemas/htmlSelector'
        positiveKeyword:
          type: array
          items:
            type: string
        negativeKeyword:
          type: array
          items:
            type: string

    htmlSelector:
      type: object
      required:
        - containerCard
        - company
        - title
        - location
        - postedDate
        - candidates
        - body
        - infoJob1
        - infoJob2
      properties:
        company:
          type: string
          description: Nome dell'azienda
        title:
          type: string
          description: Titolo dell'offerta (es. Software Engineer)
        location:
          type: string
          description: Luogo dell'offerta di lavoro (es. Monaco)
        postedDate:
          type: string
          description: Quanto tempo fa é stata postata questa offerta (es. 58 minutes ago)
        candidates:
          type: string
          description: Quante persone si sono giá candidate
        body:
          type: string
          description: Body dell'offerta
        containerCard:
          type: string
          description: |
            Card che contiene le informazioni principali dell'offerta (sopra il body). Questa card é quella
            che verrá colorata
        infoJob1:
          type: string
          description: Contiene luogo, data di posting e candidati
        infoJob2:
          type: string
          description: Contiene Full-time e pubblicitá per il premium

    errorResponseMessage:
      type: object
      required:
        - status
        - error
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          minLength: 1
          example: "31"
        timestamp:
          type: string
          format: date-time

    esito:
      type: string
      enum:
        - NEW # The job posting has just been acquired and hasn't been analyzed or processed yet
        - TOO_MANY_CANDIDATES
        - ALREADY_SEEN # The job posting has already been processed or viewed previously
        - UNSUITABLE_LANGUAGE # The language of the job posting is not among those spoken or understood by the user
        - SKILLS_MISMATCH # The job posting requires skills that don't align with the user's profile
        - EXPERIENCE_MISMATCH # The job posting requires an experience level incompatible with the user's (e.g., too much or too little)
        - UNSUITABLE_LOCATION # The job's location indicated in the posting is not in an area of interest to the user
        - UNSUITABLE_CONTRACT_TYPE # The type of contract offered (e.g., part-time, fixed-term, internship) is not what the user desires

    correlationId:
      type: string
      minLength: 1
      maxLength: 36
      example: 5ef755b5-fc9e-467a-9022-23b9e2f9616

  parameters:
    correlationIdRequestHeader:
      name: correlationId
      in: header
      required: true
      description: |
        Header di identificazione delle informazioni del chiamante: Codice
        alfanumerico di correlazione. Di solito uuid
      schema:
        $ref: '#/components/schemas/correlationId'
      example: 5ef755b5-fc9e-467a-9022-23b9e2f9616
