spring.application.name=jobfinder
spring.profiles.active=TEST

# questo é indicato nei controller perché altrimenti obbligava a legare '/api/v1' anche all' actuator
#spring.mvc.servlet.path=/be-jobfinder/api/v1
apiPath=/api/v1
server.port=8080

# healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Definire un base path separato per gli endpoint actuator. Questo serve per omettere /api/v1 da questi endpoint
management.endpoints.web.base-path=/be-jobfinder/actuator

# logging
logging.config=${user.dir}/config/test/logback.xml

# H2
spring.datasource.url=jdbc:h2:file:${user.dir}/database/jobfinder_test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# abilita la console web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# strategia di inizializzazione del database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# config
job.posting.max.candidates=40
job.posting.language.handling=ENGLISH,POLISH,GERMAN,DUTCH,DANISH,SPANISH,FRENCH,SWEDISH,ITALIAN
job.posting.language.preferred=ENGLISH,ITALIAN
job.posting.keywords.positive=java,spring
job.posting.keywords.negative=c#,ruby,angular,javascript,typescript
