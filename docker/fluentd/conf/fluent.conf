# ========== INPUT: Docker logging driver (stdout) ==========
<source>
  @type forward
  @id in_forward
  port 24224
  bind 0.0.0.0
</source>

# ========== INPUT: tutti i file di log in /app/logs ==========
<source>
  @type tail
  @id in_tail_app_logs
  path /app/logs/be-jobfinder-trace.log*
  pos_file /fluentd/pos/app-logs.pos
  tag app.logs
  read_from_head true
  path_key log.filepath
  rotate_wait 5s
  refresh_interval 5
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\|(?<level>[A-Z]+)\|thread=(?<thread>[^|]+)\|loggerName=(?<logger>[^|]+)\|applicazione=(?<applicazione>[^|]+)\|componente=(?<componente>[^|]+)\|correlationId=(?<correlationId>[^|]+)\|operation=(?<operation>[^|]+)\|logMessage=(?<logMessage>.*)$/
    time_key timestamp
    time_format %Y-%m-%d %H:%M:%S.%L
  </parse>
</source>

# ========== FILTER: accetta SOLO eventi con path in /app/logs ==========
# (ridondante visto il path sopra, ma utile come guard-rail)
<filter app.logs>
  @type grep
  <regexp>
    key log.filepath
    pattern ^/app/logs/
  </regexp>
</filter>

# ========== OUTPUT: Elasticsearch ==========
# Inoltra SOLO i log taggati app.logs (quindi niente stdout docker ecc.)
<match app.logs>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix jobfinder           # indice jobfinder-YYYY.MM.DD
  include_tag_key true
  tag_key "@log_tag"
  reconnect_on_error true
  request_timeout 60s
</match>
